{% extends "base.html" %}
{% block title %}注册 - 联机聊天{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>注册账号</h1>
            <p>加入局域网聊天平台</p>
        </div>
        <form id="registerForm" class="auth-form" onsubmit="return register(event)">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required minlength="2" maxlength="20" placeholder="2-20个字符">
            </div>
            <div class="form-group">
                <label for="nickname">昵称（可选）</label>
                <input type="text" id="nickname" name="nickname" maxlength="20" placeholder="显示在聊天中的名字">
            </div>
            <div class="form-group">
                <label for="email">邮箱（可选）</label>
                <input type="email" id="email" name="email" placeholder="用于找回密码">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="至少6个字符">
            </div>
            <div class="form-group">
                <label for="confirm">确认密码</label>
                <input type="password" id="confirm" name="confirm" required placeholder="再次输入密码">
            </div>
            <div id="errorMsg" class="error-msg" style="display:none"></div>
            <button type="submit" class="btn btn-primary btn-full">注册</button>
        </form>
        <div class="auth-links">
            <a href="/login">已有账号？登录</a>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/app.js"></script>
{% endblock %}
