{% extends "base.html" %}
{% block title %}登录 - 联机聊天{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>联机聊天</h1>
            <p>登录到局域网聊天平台</p>
        </div>
        <form id="loginForm" class="auth-form" onsubmit="return login(event)">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required minlength="2" maxlength="20" placeholder="输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="输入密码">
            </div>
            <div id="errorMsg" class="error-msg" style="display:none"></div>
            <button type="submit" class="btn btn-primary btn-full">登录</button>
        </form>
        <div class="auth-links">
            <a href="/register">没有账号？注册</a>
            <a href="#" onclick="alert('请联系管理员重置密码')">忘记密码</a>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/app.js"></script>
{% endblock %}
